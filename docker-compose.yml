version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: motorguard-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-motorguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-motorguard_secret}
      POSTGRES_DB: ${POSTGRES_DB:-motorguard_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-motorguard}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: motorguard-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-motorguard}:${POSTGRES_PASSWORD:-motorguard_secret}@postgres:5432/${POSTGRES_DB:-motorguard_db}
      AI_MODEL_DIR: /app/ai/models
      AI_MODEL_VERSION: "1.0.0"
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-random-secret-key}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./ai/models:/app/ai/models:ro
    restart: unless-stopped

volumes:
  pgdata:
