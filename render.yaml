services:
  - type: web
    name: ai-motorguard-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./motorguard.db
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO
